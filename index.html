<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <!-- Google Analytics (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-0MXD1F0B1S"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Qureo-By Youssef</title>
    <style>
        :root {
            --bg-main: #0b0e16;
            --bg-card: rgba(20, 25, 40, 0.7);
            --border-card: rgba(255, 255, 255, 0.05);
            --text-main: #f0f3f8;
            --text-sub: #8f9bb5;
            --accent-red: #e53e3e;
            --accent-yellow: #fbbf24;
            --accent-green: #48bb78;
            --transition-smooth: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', 'Cairo', 'Tajawal', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(135deg, var(--bg-main) 0%, #141a24 100%);
            color: var(--text-main);
            padding: 2rem 1.5rem;
            min-height: 100vh;
            line-height: 1.6;
        }

        .levels-container {
            max-width: 1000px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        .header-actions {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            flex-wrap: wrap;
            margin-bottom: 1.5rem;
            gap: 1.5rem;
            background: rgba(255, 255, 255, 0.02);
            padding: 1.5rem;
            border-radius: 1.5rem;
            border: 1px solid var(--border-card);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            position: relative;
        }

        .header-titles h1 {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(120deg, #FFB347, #FF6B6B);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            margin-bottom: 0.5rem;
            transition: var(--transition-smooth);
        }

        .header-titles .sub {
            color: var(--text-sub);
            font-size: 0.9rem;
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: #ffecb3;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: var(--transition-smooth);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateX(5px);
        }

        .progress-wrapper {
            flex: 1;
            min-width: 250px;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .progress-stats {
            font-size: 0.95rem;
            font-weight: 600;
            color: #cbd5ff;
        }

        .progress-bar-container {
            width: 100%;
            height: 8px;
            background: #1e2538;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent-yellow), var(--accent-green));
            border-radius: 10px;
            transition: width 0.5s ease-out;
        }

        .reset-btn {
            background: #2d3748;
            border: 1px solid rgba(255,255,255,0.1);
            padding: 0.6rem 1.5rem;
            border-radius: 40px;
            font-weight: 600;
            color: #ffe1b3;
            cursor: pointer;
            transition: var(--transition-smooth);
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .reset-btn:hover {
            background: var(--accent-red);
            color: white;
            border-color: var(--accent-red);
            transform: translateY(-2px);
            box-shadow: 0 8px 15px rgba(229, 62, 62, 0.3);
        }

        .reset-btn:active {
            transform: scale(0.95);
        }

        /* ---------- Home View Styles ---------- */
        .home-view {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 75vh;
            gap: 2.5rem;
            padding: 1rem;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .home-header h1 {
            font-size: 2.5rem;
            text-align: center;
            background: linear-gradient(120deg, #FFB347, #FF6B6B);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            margin-bottom: 0.5rem;
        }

        .home-header p {
            text-align: center;
            color: var(--text-sub);
            font-size: 1.1rem;
        }

        .lang-cards {
            display: flex;
            gap: 2rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .lang-card {
            width: 300px;
            border-radius: 2rem;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.4s;
            border: 1px solid rgba(255,255,255,0.1);
            color: white;
            position: relative;
            overflow: hidden;
        }

        .lang-card:hover {
            transform: translateY(-12px) scale(1.02);
        }

        .js-card {
            background: linear-gradient(145deg, #8e44ad, #9b59b6);
            box-shadow: 0 15px 35px rgba(142, 68, 173, 0.4);
        }

        .py-card {
            background: linear-gradient(145deg, #16a085, #1abc9c);
            box-shadow: 0 15px 35px rgba(22, 160, 133, 0.4);
        }

        .lang-card h2 {
            font-size: 2rem;
            margin-bottom: 0.25rem;
            font-weight: 800;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }

        .lang-card .level-count {
            font-size: 0.9rem;
            opacity: 0.8;
            margin-bottom: 1rem;
            background: rgba(0,0,0,0.2);
            padding: 0.2rem 0.8rem;
            border-radius: 20px;
        }

        .character-container {
            font-size: 5.5rem;
            margin: 0.5rem 0 1.5rem;
            animation: floatImage 3.5s ease-in-out infinite;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.3));
        }

        .code-window {
            width: 100%;
            background: rgba(0,0,0,0.35);
            border-radius: 12px;
            padding: 15px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .code-dots {
            display: flex;
            gap: 6px;
            margin-bottom: 12px;
        }

        .code-dots span {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }

        .code-dots span:nth-child(1) { background: #ff5f56; }
        .code-dots span:nth-child(2) { background: #ffbd2e; }
        .code-dots span:nth-child(3) { background: #27c93f; }

        .code-lines {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .line {
            height: 6px;
            background: rgba(255,255,255,0.25);
            border-radius: 3px;
        }

        @keyframes floatImage {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-12px); }
            100% { transform: translateY(0px); }
        }

        /* ---------- Levels View Styles ---------- */
        .level-card {
            border-radius: 1.2rem;
            background: var(--bg-card);
            backdrop-filter: blur(10px);
            transition: var(--transition-smooth);
            border: 1px solid var(--border-card);
            overflow: hidden;
            will-change: transform, box-shadow;
        }

        .level-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        .level-card.state-red { border-right: 5px solid var(--accent-red); }
        .level-card.state-yellow {
            background: linear-gradient(110deg, rgba(58, 42, 26, 0.8), rgba(42, 32, 24, 0.8));
            border-right: 5px solid var(--accent-yellow);
            box-shadow: 0 0 20px rgba(251, 191, 36, 0.15);
            border-color: rgba(251, 191, 36, 0.2);
        }
        .level-card.state-green { border-right: 5px solid var(--accent-green); }

        .level-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.2rem 1.5rem;
            cursor: pointer;
            transition: var(--transition-smooth);
        }

        .level-header:hover { background: rgba(255, 255, 255, 0.03); }

        .level-title {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .level-num {
            background: rgba(0, 0, 0, 0.4);
            padding: 0.3rem 1.2rem;
            border-radius: 60px;
            font-weight: 700;
            font-size: 1.1rem;
            color: #ffecb3;
            letter-spacing: 0.5px;
        }

        .level-badge {
            font-size: 0.8rem;
            background: rgba(255, 255, 255, 0.08);
            padding: 0.3rem 0.8rem;
            border-radius: 30px;
            color: #bfc9f0;
            font-weight: 500;
        }

        .level-arrow {
            font-size: 1rem;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            color: var(--text-sub);
        }

        .level-card.is-open .level-arrow {
            transform: rotate(180deg);
            color: var(--accent-yellow);
        }

        .answers-wrapper {
            display: grid;
            grid-template-rows: 0fr;
            transition: grid-template-rows 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .level-card.is-open .answers-wrapper { grid-template-rows: 1fr; }

        .answers-inner { overflow: hidden; }

        .answers-container {
            padding: 0 1.5rem 1.5rem 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            border-top: 1px solid rgba(255,255,255,0.03);
            margin-top: 0.5rem;
            padding-top: 1.5rem;
        }

        .answer-item {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 1rem;
            display: flex;
            align-items: stretch;
            justify-content: space-between;
            gap: 0;
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: var(--transition-smooth);
            overflow: hidden;
        }
        
        .answer-item:hover {
            border-color: rgba(255, 180, 100, 0.3);
            background: rgba(0, 0, 0, 0.5);
        }

        .answer-main {
            flex: 0 0 94%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1.5rem;
            padding: 1rem;
            flex-wrap: wrap;
        }

        .answer-number {
            flex: 0 0 6%;
            background: #2a2e3f;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 1.2rem;
            color: #cdd9ff;
            border-left: 1px solid rgba(255,255,255,0.1);
            font-family: monospace;
            text-align: center;
        }

        .answer-code {
            flex: 1;
            font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace;
            font-size: 0.9rem;
            line-height: 1.6;
            color: #e2e8f0;
            white-space: pre-wrap;
            word-break: break-word;
            direction: ltr;
            text-align: left;
        }

        .copy-btn {
            background: linear-gradient(135deg, #2d3748, #1a202c);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            color: #e2e8f0;
            cursor: pointer;
            transition: var(--transition-smooth);
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .copy-btn:hover {
            background: linear-gradient(135deg, var(--accent-green), #38a169);
            color: white;
            border-color: transparent;
            box-shadow: 0 4px 12px rgba(72, 187, 120, 0.3);
            transform: translateY(-2px);
        }

        .copy-btn:active { transform: scale(0.92); }

        .answer-item-split {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 1rem;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            padding: 1rem;
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: var(--transition-smooth);
        }
        
        .answer-item-split:hover {
            border-color: rgba(255, 180, 100, 0.3);
            background: rgba(0, 0, 0, 0.5);
        }
        
        .split-part {
            background: rgba(0, 0, 0, 0.25);
            border-radius: 0.8rem;
            display: flex;
            align-items: stretch;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.05);
        }
        
        .split-part .answer-number {
            flex: 0 0 6%;
            background: #2a2e3f;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 1.2rem;
            color: #cdd9ff;
            border-left: 1px solid rgba(255,255,255,0.1);
            font-family: monospace;
        }
        
        .split-part .answer-main {
            flex: 0 0 94%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1.5rem;
            padding: 0.75rem;
            flex-wrap: wrap;
        }

        .toast-msg {
            position: fixed;
            bottom: -100px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(31, 42, 31, 0.9);
            color: #ccffcc;
            padding: 0.8rem 1.5rem;
            border-radius: 50px;
            font-size: 0.95rem;
            backdrop-filter: blur(12px);
            z-index: 1000;
            transition: bottom 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            pointer-events: none;
            font-weight: 600;
            border: 1px solid rgba(72, 187, 120, 0.3);
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        .toast-msg.show { bottom: 30px; }

        .welcome-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            opacity: 1;
            transition: opacity 0.5s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            will-change: opacity;
        }

        .welcome-overlay.fade-out {
            opacity: 0;
            pointer-events: none;
        }

        .popup-card {
            background: linear-gradient(145deg, rgba(25, 30, 45, 0.95), rgba(15, 20, 35, 0.98));
            backdrop-filter: blur(18px);
            border-radius: 2.5rem;
            padding: 2rem 1.8rem;
            width: 90%;
            max-width: 400px;
            text-align: center;
            border: 1px solid rgba(255, 215, 150, 0.4);
            box-shadow: 0 30px 50px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 200, 100, 0.2) inset;
            transition: transform 0.4s ease-out;
            transform: scale(1);
        }

        .welcome-overlay.fade-out .popup-card {
            transform: scale(0.96);
        }

        .avatar-glow {
            width: 140px;
            height: 140px;
            margin: 0 auto 1.5rem auto;
            border-radius: 50%;
            background: linear-gradient(135deg, #ffb347, #ff6b6b);
            padding: 4px;
            box-shadow: 0 0 20px rgba(255, 180, 70, 0.6), 0 0 35px rgba(255, 100, 80, 0.3);
            animation: floatImage 3.5s ease-in-out infinite, glowPulse 2.2s infinite alternate;
        }

        .avatar-glow img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            display: block;
            background: #1e1e2a;
        }

        @keyframes glowPulse {
            0% { box-shadow: 0 0 12px rgba(255, 180, 70, 0.5), 0 0 20px rgba(255, 100, 80, 0.2); }
            100% { box-shadow: 0 0 28px rgba(255, 200, 100, 0.9), 0 0 40px rgba(255, 120, 80, 0.5); }
        }

        .popup-card h2 {
            font-size: 1.9rem;
            font-weight: 800;
            background: linear-gradient(120deg, #FFD966, #FFA559);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            margin: 0.5rem 0 0.75rem;
            letter-spacing: 1px;
        }

        .popup-desc {
            font-size: 0.9rem;
            color: #b9c7dd;
            margin-top: 1rem;
            border-top: 1px dashed rgba(255, 200, 100, 0.3);
            padding-top: 1rem;
        }

        .close-hint {
            font-size: 0.7rem;
            color: #8f9bb5;
            margin-top: 0.8rem;
            cursor: default;
        }

        @media (max-width: 500px) {
            .popup-card { padding: 1.5rem; }
            .avatar-glow { width: 110px; height: 110px; }
            .popup-card h2 { font-size: 1.5rem; }
            .answer-item { flex-direction: column; }
            .answer-main { flex: auto; width: 100%; }
            .answer-number { flex: auto; width: 100%; padding: 0.5rem; border-left: none; border-top: 1px solid rgba(255,255,255,0.1); }
            .answer-item-split { grid-template-columns: 1fr; gap: 0.8rem; }
            .split-part { flex-direction: column; }
            .split-part .answer-number { flex: auto; width: 100%; border-left: none; border-top: 1px solid rgba(255,255,255,0.1); }
            .split-part .answer-main { flex: auto; width: 100%; }
            .copy-btn { align-self: flex-end; width: 100%; justify-content: center; }
            .lang-card { width: 100%; max-width: 300px; }
        }

        footer {
            text-align: center;
            margin-top: 3rem;
            color: var(--text-sub);
            font-size: 0.85rem;
            opacity: 0.7;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="levels-container">
    <div class="header-actions">
        <div class="header-titles">
            <button id="backBtn" class="back-btn hidden" onclick="goHome()">➡ العودة للرئيسية</button>
            <h1 id="mainTitle">𝒀𝒐𝒖𝒔𝒔𝒆𝒇 𝒔𝑒𝒍𝒊𝒎</h1>
            <div class="sub" id="subTitle">اختر اللغة لبدء التعلم</div>
        </div>
        
        <div class="progress-wrapper hidden" id="progressWrapper">
            <div class="progress-header">
                <span class="progress-stats" id="progressStats">التقدم: 0 / 0</span>
                <button class="reset-btn" id="resetProgressBtn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
                    إعادة ضبط
                </button>
            </div>
            <div class="progress-bar-container">
                <div class="progress-bar-fill" id="progressBarFill"></div>
            </div>
        </div>
    </div>

    <!-- Home View -->
    <div id="homeView" class="home-view">
        <div class="home-header">
            <h1>اختر لغة البرمجة</h1>
            <p>استعرض الحلول والأجوبة الخاصة بكل لغة</p>
        </div>
        <div class="lang-cards">
            <div class="lang-card js-card" onclick="selectLang('javascript')">
                <h2>JavaScript</h2>
                <span class="level-count">54 مستوى</span>
                <div class="character-container">🤖</div>
                <div class="code-window">
                    <div class="code-dots"><span></span><span></span><span></span></div>
                    <div class="code-lines">
                        <div class="line" style="width: 70%;"></div>
                        <div class="line" style="width: 90%;"></div>
                        <div class="line" style="width: 50%;"></div>
                        <div class="line" style="width: 80%;"></div>
                    </div>
                </div>
            </div>
            <div class="lang-card py-card" onclick="selectLang('python')">
                <h2>Python</h2>
                <span class="level-count">25 مستوى</span>
                <div class="character-container">🐍</div>
                <div class="code-window">
                    <div class="code-dots"><span></span><span></span><span></span></div>
                    <div class="code-lines">
                        <div class="line" style="width: 60%;"></div>
                        <div class="line" style="width: 85%;"></div>
                        <div class="line" style="width: 40%;"></div>
                        <div class="line" style="width: 70%;"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Levels View -->
    <div id="langView" class="hidden">
        <div id="levelsRender"></div>
    </div>
    
    <footer>✨ 𝒀𝒐𝒖𝒔𝒔𝒆𝒇 𝒔𝑒𝒍𝒊𝒎 ✨</footer>
</div>

<div class="toast-msg" id="toastMsg">تم النسخ بنجاح!</div>

<script>
    // --------------------------------------------------------------
    // 1. Data Base (Both JavaScript and Python)
    // --------------------------------------------------------------
    const data = {
        javascript: {
            1: ["console.log(\"Hello\");","console.log(\"Good morning\");","console.log(\"Programming\");","console.log(\"Hello\");","//Write your comments here.","console.log(\"Hello.\");\nconsole.log(\"My name is\");\n//console.log(\"Rick.\");\nconsole.log(\"Cody.\");"],

    // --------------------------------------------------------------
    // 2. State Management
    // --------------------------------------------------------------
    let state = {
        view: 'home', // 'home' or 'lang'
        lang: 'javascript',
        visited: {
            javascript: new Set(),
            python: new Set()
        },
        currentLv: {
            javascript: 1,
            python: 1
        }
    };

    function debounce(func, wait) {
        let timeout;
        return function(...args) {
            clearTimeout(timeout);
            timeout = setTimeout(() => func.apply(this, args), wait);
        };
    }

    const saveStateDebounced = debounce(() => {
        localStorage.setItem('learn_state', JSON.stringify({
            view: state.view,
            lang: state.lang,
            visited: {
                javascript: [...state.visited.javascript],
                python: [...state.visited.python]
            },
            currentLv: state.currentLv
        }));
    }, 500);

    function loadState() {
        const stored = localStorage.getItem('learn_state');
        if (stored) {
            try {
                const parsed = JSON.parse(stored);
                if (parsed.view) state.view = parsed.view;
                if (parsed.lang) state.lang = parsed.lang;
                if (parsed.visited) {
                    state.visited.javascript = new Set(parsed.visited.javascript || []);
                    state.visited.python = new Set(parsed.visited.python || []);
                }
                if (parsed.currentLv) {
                    state.currentLv = parsed.currentLv;
                }
            } catch (e) { console.error("Error loading state", e); }
        }
        
        // Ensure initial levels are marked as visited
        if (!state.visited.javascript.has(1)) state.visited.javascript.add(1);
        if (!state.visited.python.has(1)) state.visited.python.add(1);
        
        // Update UI based on loaded state
        if (state.view === 'lang') {
            selectLang(state.lang, true);
        } else {
            goHome(true);
        }
    }
    
    function updateProgressUI() {
        const statsSpan = document.getElementById('progressStats');
        const progressBarFill = document.getElementById('progressBarFill');
        const total = Object.keys(data[state.lang]).length;
        const count = state.visited[state.lang].size;
        
        if (statsSpan) statsSpan.innerText = `التقدم: ${count} / ${total}`;
        if (progressBarFill) progressBarFill.style.width = `${(count / total) * 100}%`;
    }
    
    function updateCardsColors() {
        const total = Object.keys(data[state.lang]).length;
        for (let lvl = 1; lvl <= total; lvl++) {
            const card = document.getElementById(`level-card-${lvl}`);
            if (!card) continue;
            const isVisited = state.visited[state.lang].has(lvl);
            const isCurrent = (lvl === state.currentLv[state.lang]);
            
            card.classList.remove('state-red', 'state-yellow', 'state-green');
            if (isCurrent) card.classList.add('state-yellow');
            else if (isVisited) card.classList.add('state-green');
            else card.classList.add('state-red');
        }
    }
    
    function renderAllLevels() {
        const container = document.getElementById('levelsRender');
        if (!container) return;
        container.innerHTML = '';
        
        const currentData = data[state.lang];
        const totalLevels = Object.keys(currentData).length;
        
        const fragment = document.createDocumentFragment();
        for (let lvl = 1; lvl <= totalLevels; lvl++) {
            const answersCount = currentData[lvl] ? currentData[lvl].length : 0;
            const card = document.createElement('div');
            card.id = `level-card-${lvl}`;
            card.className = 'level-card';
            card.dataset.level = lvl;
            card.innerHTML = `
                <div class="level-header">
                    <div class="level-title">
                        <span class="level-num">المستوى ${lvl}</span>
                        <span class="level-badge">📋 ${answersCount} إجابة</span>
                    </div>
                    <div class="level-arrow">▼</div>
                </div>
                <div class="answers-wrapper">
                    <div class="answers-inner">
                        <div class="answers-container" data-loaded="false"></div>
                    </div>
                </div>
            `;
            fragment.appendChild(card);
        }
        container.appendChild(fragment);
        updateCardsColors();
    }
    
    function escapeHtml(str) {
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }
    
    function loadAnswersIntoDOM(levelNum, container) {
        if (container.dataset.loaded === "true") return;
        const answers = data[state.lang][levelNum] || [];
        const fragment = document.createDocumentFragment();
        
        if (answers.length === 0) {
            const emptyMsg = document.createElement('div');
            emptyMsg.className = 'answer-item';
            emptyMsg.innerHTML = `<div class="answer-number">—</div><div class="answer-main"><div class="answer-code" style="color:var(--text-sub)">✨ لا توجد إجابات مسجلة لهذا المستوى</div></div>`;
            fragment.appendChild(emptyMsg);
        } else {
            answers.forEach((ans, idx) => {
                // Special split logic only for JavaScript levels 11, 18, 19 at the last index
                const isSpecialSplit = state.lang === 'javascript' && 
                                       (levelNum === 11 || levelNum === 18 || levelNum === 19) && 
                                       idx === answers.length - 1;
                const answerNumber = idx + 1;
                
                if (isSpecialSplit) {
                    const splitContainer = document.createElement('div');
                    splitContainer.className = 'answer-item-split';
                    
                    let leftText = '', rightText = '';
                    if (levelNum === 11) {
                        leftText = "for";
                        rightText = "let i=0 ; i < 3 ; i++";
                    } else if (levelNum === 18) {
                        leftText = "<!--";
                        rightText = "-->";
                    } else if (levelNum === 19) {
                        leftText = "/*";
                        rightText = "*/";
                    }
                    
                    const rightPart = document.createElement('div');
                    rightPart.className = 'split-part';
                    rightPart.innerHTML = `
                        <div class="answer-number">${answerNumber}</div>
                        <div class="answer-main">
                            <div class="answer-code">${escapeHtml(rightText)}</div>
                            <button class="copy-btn">📋 نسخ</button>
                        </div>
                    `;
                    rightPart.querySelector('.copy-btn').setAttribute('data-raw-answer', rightText);
                    
                    const leftPart = document.createElement('div');
                    leftPart.className = 'split-part';
                    leftPart.innerHTML = `
                        <div class="answer-number">${answerNumber}</div>
                        <div class="answer-main">
                            <div class="answer-code">${escapeHtml(leftText)}</div>
                            <button class="copy-btn">📋 نسخ</button>
                        </div>
                    `;
                    leftPart.querySelector('.copy-btn').setAttribute('data-raw-answer', leftText);
                    
                    splitContainer.appendChild(rightPart);
                    splitContainer.appendChild(leftPart);
                    fragment.appendChild(splitContainer);
                } else {
                    const item = document.createElement('div');
                    item.className = 'answer-item';
                    const escapedAns = escapeHtml(ans);
                    item.innerHTML = `
                        <div class="answer-number">${answerNumber}</div>
                        <div class="answer-main">
                            <div class="answer-code">${escapedAns}</div>
                            <button class="copy-btn">📋 نسخ</button>
                        </div>
                    `;
                    item.querySelector('.copy-btn').setAttribute('data-raw-answer', ans);
                    fragment.appendChild(item);
                }
            });
        }
        container.appendChild(fragment);
        container.dataset.loaded = "true";
    }

    function toggleLevel(levelNum, cardElement) {
        const isOpen = cardElement.classList.contains('is-open');
        const answersContainer = cardElement.querySelector('.answers-container');
        
        if (!state.visited[state.lang].has(levelNum)) state.visited[state.lang].add(levelNum);
        state.currentLv[state.lang] = levelNum;
        
        saveStateDebounced();
        updateProgressUI();
        updateCardsColors();
        
        if (!isOpen) {
            loadAnswersIntoDOM(levelNum, answersContainer);
            cardElement.classList.add('is-open');
            setTimeout(() => cardElement.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 300);
        } else {
            cardElement.classList.remove('is-open');
        }
    }

    async function copyToClipboard(rawText) {
        try {
            await navigator.clipboard.writeText(rawText);
            showToast();
        } catch (err) {
            const textarea = document.createElement('textarea');
            textarea.value = rawText;
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                showToast();
            } catch (e) {
                alert('تعذر نسخ النص، يرجى المحاولة يدوياً');
            }
            document.body.removeChild(textarea);
        }
    }

    let toastTimeout;
    function showToast() {
        const toast = document.getElementById('toastMsg');
        toast.classList.add('show');
        clearTimeout(toastTimeout);
        toastTimeout = setTimeout(() => toast.classList.remove('show'), 2000);
    }

    // --------------------------------------------------------------
    // 3. Navigation Logic
    // --------------------------------------------------------------
    function selectLang(lang, isInitial = false) {
        state.lang = lang;
        state.view = 'lang';
        
        document.getElementById('homeView').classList.add('hidden');
        document.getElementById('langView').classList.remove('hidden');
        document.getElementById('backBtn').classList.remove('hidden');
        document.getElementById('progressWrapper').classList.remove('hidden');
        
        const mainTitle = document.getElementById('mainTitle');
        const subTitle = document.getElementById('subTitle');
        
        if (lang === 'javascript') {
            mainTitle.innerText = 'JavaScript Solutions';
            mainTitle.style.background = 'linear-gradient(120deg, #c39bd3, #9b59b6)';
            subTitle.innerText = 'أجوبة المستويات من 1 إلى 54';
        } else {
            mainTitle.innerText = 'Python Solutions';
            mainTitle.style.background = 'linear-gradient(120deg, #1abc9c, #16a085)';
            subTitle.innerText = 'أجوبة المستويات من 1 إلى 25';
        }
        mainTitle.style.webkitBackgroundClip = 'text';
        mainTitle.style.color = 'transparent';

        if (!isInitial) {
            renderAllLevels();
        }
        updateProgressUI();
        saveStateDebounced();
    }

    function goHome(isInitial = false) {
        state.view = 'home';
        
        document.getElementById('homeView').classList.remove('hidden');
        document.getElementById('langView').classList.add('hidden');
        document.getElementById('backBtn').classList.add('hidden');
        document.getElementById('progressWrapper').classList.add('hidden');
        
        const mainTitle = document.getElementById('mainTitle');
        const subTitle = document.getElementById('subTitle');
        
        mainTitle.innerText = '𝒀𝒐𝒖𝒔𝒔𝒆𝒇 𝒔𝑒𝒍𝒊𝒎';
        mainTitle.style.background = 'linear-gradient(120deg, #FFB347, #FF6B6B)';
        mainTitle.style.webkitBackgroundClip = 'text';
        mainTitle.style.color = 'transparent';
        subTitle.innerText = 'اختر اللغة لبدء التعلم';
        
        saveStateDebounced();
    }

    // Event delegation for levels
    document.getElementById('levelsRender').addEventListener('click', (e) => {
        const header = e.target.closest('.level-header');
        if (header) {
            const card = header.closest('.level-card');
            const lvl = parseInt(card.dataset.level, 10);
            toggleLevel(lvl, card);
            return;
        }
        const copyBtn = e.target.closest('.copy-btn');
        if (copyBtn) {
            const originalText = copyBtn.getAttribute('data-raw-answer');
            if (originalText) copyToClipboard(originalText);
        }
    });

    document.getElementById('resetProgressBtn').addEventListener('click', () => {
        if(confirm('هل أنت متأكد من إعادة ضبط تقدم هذه اللغة؟')) {
            state.visited[state.lang].clear();
            state.currentLv[state.lang] = 1;
            state.visited[state.lang].add(1);
            saveStateDebounced();
            renderAllLevels(); 
            updateProgressUI();
            
            const toast = document.getElementById('toastMsg');
            toast.innerText = '🔄 تم تصفير التقدم بنجاح';
            showToast();
            setTimeout(() => toast.innerText = 'تم النسخ بنجاح!', 2500);
        }
    });

    // Initialize
    loadState();

    // Welcome Popup
    function createWelcomePopup() {
        if (document.getElementById('welcomePopupOverlay')) return;
        const overlay = document.createElement('div');
        overlay.id = 'welcomePopupOverlay';
        overlay.className = 'welcome-overlay';
        overlay.innerHTML = `
            <div class="popup-card">
                <div class="avatar-glow">
                    <img src="https://i.postimg.cc/fLbNQTqC/Youssef.jpg" alt="𝒀𝒐𝒖𝒔𝒔𝒆𝒇 𝒔𝑒𝒍𝒊𝒎" loading="eager">
                </div>
                <h2>𝒀𝒐𝒖𝒔𝒔𝒆𝒇 𝒔𝑒𝒍𝒊𝒎</h2>
                <div class="popup-desc">✨ Welcome To ✨<br> Qureo Answers</div>
                <div class="close-hint">( اضغط في أي مكان للإغلاق )</div>
            </div>
        `;
        document.body.appendChild(overlay);
        
        let isClosing = false;
        let autoTimeout = setTimeout(() => closePopup(overlay, () => isClosing = true), 5000);
        
        const closePopup = (overlayEl, setFlag) => {
            if (isClosing) return;
            setFlag();
            clearTimeout(autoTimeout);
            overlayEl.classList.add('fade-out');
            overlayEl.addEventListener('transitionend', () => overlayEl.remove(), { once: true });
        };
        
        const handleOutsideClick = (e) => {
            if (e.target === overlay) {
                closePopup(overlay, () => isClosing = true);
            }
        };
        overlay.addEventListener('click', handleOutsideClick);
        overlay.addEventListener('transitionend', () => overlay.removeEventListener('click', handleOutsideClick));
    }
    
    window.addEventListener('load', () => setTimeout(createWelcomePopup, 200));
</script>
