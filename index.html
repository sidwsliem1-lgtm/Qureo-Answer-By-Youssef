<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Qureo-By Youssef</title>
    <style>
        :root {
            --bg-main: #0b0e16;
            --bg-card: rgba(20, 25, 40, 0.7);
            --border-card: rgba(255, 255, 255, 0.05);
            --text-main: #f0f3f8;
            --text-sub: #8f9bb5;
            --accent-red: #e53e3e;
            --accent-yellow: #fbbf24;
            --accent-green: #48bb78;
            --transition-smooth: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', 'Cairo', 'Tajawal', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(135deg, var(--bg-main) 0%, #141a24 100%);
            color: var(--text-main);
            padding: 2rem 1.5rem;
            min-height: 100vh;
            line-height: 1.6;
        }

        .levels-container {
            max-width: 1000px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        .header-actions {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            flex-wrap: wrap;
            margin-bottom: 1.5rem;
            gap: 1.5rem;
            background: rgba(255, 255, 255, 0.02);
            padding: 1.5rem;
            border-radius: 1.5rem;
            border: 1px solid var(--border-card);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .header-titles h1 {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(120deg, #FFB347, #FF6B6B);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            margin-bottom: 0.5rem;
        }

        .header-titles .sub {
            color: var(--text-sub);
            font-size: 0.9rem;
        }

        .progress-wrapper {
            flex: 1;
            min-width: 250px;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .progress-stats {
            font-size: 0.95rem;
            font-weight: 600;
            color: #cbd5ff;
        }

        .progress-bar-container {
            width: 100%;
            height: 8px;
            background: #1e2538;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent-yellow), var(--accent-green));
            border-radius: 10px;
            transition: width 0.5s ease-out;
        }

        .reset-btn {
            background: #2d3748;
            border: 1px solid rgba(255,255,255,0.1);
            padding: 0.6rem 1.5rem;
            border-radius: 40px;
            font-weight: 600;
            color: #ffe1b3;
            cursor: pointer;
            transition: var(--transition-smooth);
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .reset-btn:hover {
            background: var(--accent-red);
            color: white;
            border-color: var(--accent-red);
            transform: translateY(-2px);
            box-shadow: 0 8px 15px rgba(229, 62, 62, 0.3);
        }

        .reset-btn:active {
            transform: scale(0.95);
        }

        .level-card {
            border-radius: 1.2rem;
            background: var(--bg-card);
            backdrop-filter: blur(10px);
            transition: var(--transition-smooth);
            border: 1px solid var(--border-card);
            overflow: hidden;
            will-change: transform, box-shadow;
        }

        .level-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        .level-card.state-red { border-right: 5px solid var(--accent-red); }
        .level-card.state-yellow {
            background: linear-gradient(110deg, rgba(58, 42, 26, 0.8), rgba(42, 32, 24, 0.8));
            border-right: 5px solid var(--accent-yellow);
            box-shadow: 0 0 20px rgba(251, 191, 36, 0.15);
            border-color: rgba(251, 191, 36, 0.2);
        }
        .level-card.state-green { border-right: 5px solid var(--accent-green); }

        .level-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.2rem 1.5rem;
            cursor: pointer;
            transition: var(--transition-smooth);
        }

        .level-header:hover { background: rgba(255, 255, 255, 0.03); }

        .level-title {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .level-num {
            background: rgba(0, 0, 0, 0.4);
            padding: 0.3rem 1.2rem;
            border-radius: 60px;
            font-weight: 700;
            font-size: 1.1rem;
            color: #ffecb3;
            letter-spacing: 0.5px;
        }

        .level-badge {
            font-size: 0.8rem;
            background: rgba(255, 255, 255, 0.08);
            padding: 0.3rem 0.8rem;
            border-radius: 30px;
            color: #bfc9f0;
            font-weight: 500;
        }

        .level-arrow {
            font-size: 1rem;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            color: var(--text-sub);
        }

        .level-card.is-open .level-arrow {
            transform: rotate(180deg);
            color: var(--accent-yellow);
        }

        .answers-wrapper {
            display: grid;
            grid-template-rows: 0fr;
            transition: grid-template-rows 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .level-card.is-open .answers-wrapper { grid-template-rows: 1fr; }

        .answers-inner { overflow: hidden; }

        .answers-container {
            padding: 0 1.5rem 1.5rem 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            border-top: 1px solid rgba(255,255,255,0.03);
            margin-top: 0.5rem;
            padding-top: 1.5rem;
        }

        .answer-item {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 1rem;
            padding: 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: var(--transition-smooth);
        }

        .answer-item:hover {
            border-color: rgba(255, 180, 100, 0.3);
            background: rgba(0, 0, 0, 0.5);
        }

        .answer-code {
            flex: 1;
            font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace;
            font-size: 0.9rem;
            line-height: 1.6;
            color: #e2e8f0;
            white-space: pre-wrap;
            word-break: break-word;
            direction: ltr;
            text-align: left;
        }

        .copy-btn {
            background: linear-gradient(135deg, #2d3748, #1a202c);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            color: #e2e8f0;
            cursor: pointer;
            transition: var(--transition-smooth);
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .copy-btn:hover {
            background: linear-gradient(135deg, var(--accent-green), #38a169);
            color: white;
            border-color: transparent;
            box-shadow: 0 4px 12px rgba(72, 187, 120, 0.3);
            transform: translateY(-2px);
        }

        .copy-btn:active { transform: scale(0.92); }

        .toast-msg {
            position: fixed;
            bottom: -100px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(31, 42, 31, 0.9);
            color: #ccffcc;
            padding: 0.8rem 1.5rem;
            border-radius: 50px;
            font-size: 0.95rem;
            backdrop-filter: blur(12px);
            z-index: 1000;
            transition: bottom 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            pointer-events: none;
            font-weight: 600;
            border: 1px solid rgba(72, 187, 120, 0.3);
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        .toast-msg.show { bottom: 30px; }

        /* Welcome Popup Styles */
        .welcome-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            opacity: 1;
            transition: opacity 0.5s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            will-change: opacity;
        }

        .welcome-overlay.fade-out {
            opacity: 0;
            pointer-events: none;
        }

        .popup-card {
            background: linear-gradient(145deg, rgba(25, 30, 45, 0.95), rgba(15, 20, 35, 0.98));
            backdrop-filter: blur(18px);
            border-radius: 2.5rem;
            padding: 2rem 1.8rem;
            width: 90%;
            max-width: 400px;
            text-align: center;
            border: 1px solid rgba(255, 215, 150, 0.4);
            box-shadow: 0 30px 50px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 200, 100, 0.2) inset;
            transition: transform 0.4s ease-out;
            transform: scale(1);
        }

        .welcome-overlay.fade-out .popup-card {
            transform: scale(0.96);
        }

        .avatar-glow {
            width: 140px;
            height: 140px;
            margin: 0 auto 1.5rem auto;
            border-radius: 50%;
            background: linear-gradient(135deg, #ffb347, #ff6b6b);
            padding: 4px;
            box-shadow: 0 0 20px rgba(255, 180, 70, 0.6), 0 0 35px rgba(255, 100, 80, 0.3);
            animation: floatImage 3.5s ease-in-out infinite, glowPulse 2.2s infinite alternate;
        }

        .avatar-glow img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            display: block;
            background: #1e1e2a;
        }

        @keyframes floatImage {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
            100% { transform: translateY(0px); }
        }

        @keyframes glowPulse {
            0% { box-shadow: 0 0 12px rgba(255, 180, 70, 0.5), 0 0 20px rgba(255, 100, 80, 0.2); }
            100% { box-shadow: 0 0 28px rgba(255, 200, 100, 0.9), 0 0 40px rgba(255, 120, 80, 0.5); }
        }

        .popup-card h2 {
            font-size: 1.9rem;
            font-weight: 800;
            background: linear-gradient(120deg, #FFD966, #FFA559);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            margin: 0.5rem 0 0.75rem;
            letter-spacing: 1px;
        }

        .popup-phone {
            font-size: 1.35rem;
            font-weight: 600;
            background: rgba(255, 215, 150, 0.2);
            display: inline-block;
            padding: 0.5rem 1.2rem;
            border-radius: 60px;
            backdrop-filter: blur(4px);
            color: #FFE4B5;
            border: 1px solid rgba(255, 200, 100, 0.5);
            margin: 1rem 0 0.5rem;
            font-family: monospace;
            letter-spacing: 1px;
        }

        .popup-desc {
            font-size: 0.9rem;
            color: #b9c7dd;
            margin-top: 1rem;
            border-top: 1px dashed rgba(255, 200, 100, 0.3);
            padding-top: 1rem;
        }

        .close-hint {
            font-size: 0.7rem;
            color: #8f9bb5;
            margin-top: 0.8rem;
            cursor: default;
        }

        @media (max-width: 500px) {
            .popup-card { padding: 1.5rem; }
            .avatar-glow { width: 110px; height: 110px; }
            .popup-card h2 { font-size: 1.5rem; }
            .answer-item { flex-direction: column; align-items: stretch; }
            .copy-btn { align-self: flex-end; width: 100%; justify-content: center; }
        }

        footer {
            text-align: center;
            margin-top: 3rem;
            color: var(--text-sub);
            font-size: 0.85rem;
            opacity: 0.7;
        }
    </style>
</head>

    // --------------------------------------------------------------
    // 2. State Management
    // --------------------------------------------------------------
    let visitedLevels = new Set();
    let currentLevel = 1;
    
    function debounce(func, wait) {
        let timeout;
        return function(...args) {
            clearTimeout(timeout);
            timeout = setTimeout(() => func.apply(this, args), wait);
        };
    }

    const saveStateDebounced = debounce(() => {
        localStorage.setItem('learn_visited', JSON.stringify([...visitedLevels]));
        localStorage.setItem('learn_current', currentLevel);
    }, 500);

    function loadState() {
        const storedVisited = localStorage.getItem('learn_visited');
        if (storedVisited) visitedLevels = new Set(JSON.parse(storedVisited));
        const storedCurrent = localStorage.getItem('learn_current');
        if (storedCurrent && !isNaN(parseInt(storedCurrent))) currentLevel = parseInt(storedCurrent);
        else currentLevel = 1;
        if (!visitedLevels.has(currentLevel)) visitedLevels.add(currentLevel);
        updateProgressUI();
    }
    
    function updateProgressUI() {
        const statsSpan = document.getElementById('progressStats');
        const progressBarFill = document.getElementById('progressBarFill');
        const total = 42;
        const count = visitedLevels.size;
        if (statsSpan) statsSpan.innerText = `التقدم: ${count} / ${total}`;
        if (progressBarFill) progressBarFill.style.width = `${(count / total) * 100}%`;
    }
    
    function updateCardsColors() {
        for (let lvl = 1; lvl <= 42; lvl++) {
            const card = document.getElementById(`level-card-${lvl}`);
            if (!card) continue;
            const isVisited = visitedLevels.has(lvl);
            const isCurrent = (lvl === currentLevel);
            card.classList.remove('state-red', 'state-yellow', 'state-green');
            if (isCurrent) card.classList.add('state-yellow');
            else if (isVisited) card.classList.add('state-green');
            else card.classList.add('state-red');
        }
    }
    
    function renderAllLevels() {
        const container = document.getElementById('levelsRender');
        if (!container) return;
        container.innerHTML = '';
        const fragment = document.createDocumentFragment();
        for (let lvl = 1; lvl <= 42; lvl++) {
            const answersCount = levelsData[lvl] ? levelsData[lvl].length : 0;
            const card = document.createElement('div');
            card.id = `level-card-${lvl}`;
            card.className = 'level-card';
            card.dataset.level = lvl;
            card.innerHTML = `
                <div class="level-header">
                    <div class="level-title">
                        <span class="level-num">المستوى ${lvl}</span>
                        <span class="level-badge">📋 ${answersCount} إجابة</span>
                    </div>
                    <div class="level-arrow">▼</div>
                </div>
                <div class="answers-wrapper">
                    <div class="answers-inner">
                        <div class="answers-container" data-loaded="false"></div>
                    </div>
                </div>
            `;
            fragment.appendChild(card);
        }
        container.appendChild(fragment);
        updateCardsColors();
    }
    
    // Helper: ترميز HTML آمن للعرض
    function escapeHtml(str) {
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }
    
    function loadAnswersIntoDOM(levelNum, container) {
        if (container.dataset.loaded === "true") return;
        const answers = levelsData[levelNum] || [];
        const fragment = document.createDocumentFragment();
        if (answers.length === 0) {
            const emptyMsg = document.createElement('div');
            emptyMsg.className = 'answer-item';
            emptyMsg.innerHTML = `<div class="answer-code" style="color:var(--text-sub)">✨ لا توجد إجابات مسجلة لهذا المستوى</div>`;
            fragment.appendChild(emptyMsg);
        } else {
            answers.forEach(ans => {
                const item = document.createElement('div');
                item.className = 'answer-item';
                // عرض النص بعد ترميزه HTML
                const escapedAns = escapeHtml(ans);
                item.innerHTML = `
                    <div class="answer-code">${escapedAns}</div>
                    <button class="copy-btn" data-raw-answer="${escapeHtml(ans)}">📋 نسخ</button>
                `;
                // تخزين النص الأصلي (غير المرمّز بشكل مزدوج) في السمة data-raw-answer
                // لكننا قمنا بتخزينه بعد escapeHtml? لا، يجب تخزين النص الأصلي حرفياً.
                // سنقوم بتعيين السمة بعد الإضافة باستخدام setAttribute لتجنب الترميز.
                const btn = item.querySelector('.copy-btn');
                btn.setAttribute('data-raw-answer', ans);  // النص الأصلي غير معدل
                fragment.appendChild(item);
            });
        }
        container.appendChild(fragment);
        container.dataset.loaded = "true";
    }

    function toggleLevel(levelNum, cardElement) {
        const isOpen = cardElement.classList.contains('is-open');
        const answersContainer = cardElement.querySelector('.answers-container');
        if (!visitedLevels.has(levelNum)) visitedLevels.add(levelNum);
        currentLevel = levelNum;
        saveStateDebounced();
        updateProgressUI();
        updateCardsColors();
        if (!isOpen) {
            loadAnswersIntoDOM(levelNum, answersContainer);
            cardElement.classList.add('is-open');
            setTimeout(() => cardElement.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 300);
        } else {
            cardElement.classList.remove('is-open');
        }
    }

    // دالة نسخ محسنة: تستخدم النص الأصلي المخزن في data-raw-answer
    async function copyToClipboard(rawText) {
        try {
            await navigator.clipboard.writeText(rawText);
            showToast();
        } catch (err) {
            // Fallback باستخدام textarea
            const textarea = document.createElement('textarea');
            textarea.value = rawText;
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                showToast();
            } catch (e) {
                console.error('فشل النسخ:', e);
                alert('تعذر نسخ النص، يرجى المحاولة يدوياً');
            }
            document.body.removeChild(textarea);
        }
    }

    let toastTimeout;
    function showToast() {
        const toast = document.getElementById('toastMsg');
        toast.classList.add('show');
        clearTimeout(toastTimeout);
        toastTimeout = setTimeout(() => toast.classList.remove('show'), 2000);
    }

    // Event delegation
    document.getElementById('levelsRender').addEventListener('click', (e) => {
        const header = e.target.closest('.level-header');
        if (header) {
            const card = header.closest('.level-card');
            const lvl = parseInt(card.dataset.level, 10);
            toggleLevel(lvl, card);
            return;
        }
        const copyBtn = e.target.closest('.copy-btn');
        if (copyBtn) {
            const originalText = copyBtn.getAttribute('data-raw-answer');
            if (originalText) copyToClipboard(originalText);
        }
    });

    document.getElementById('resetProgressBtn').addEventListener('click', () => {
        if(confirm('هل أنت متأكد من إعادة ضبط كل التقدم؟')) {
            visitedLevels.clear();
            currentLevel = 1;
            visitedLevels.add(1);
            saveStateDebounced();
            renderAllLevels(); 
            updateProgressUI();
            const toast = document.getElementById('toastMsg');
            toast.innerText = '🔄 تم تصفير التقدم بنجاح';
            showToast();
            setTimeout(() => toast.innerText = 'تم النسخ بنجاح!', 2500);
        }
    });

    loadState();
    renderAllLevels();

    // ---------------------- Welcome Popup (يختفي بعد 5 ثوانٍ أو عند النقر خارج البطاقة) ----------------------
    function createWelcomePopup() {
        if (document.getElementById('welcomePopupOverlay')) return;
        const overlay = document.createElement('div');
        overlay.id = 'welcomePopupOverlay';
        overlay.className = 'welcome-overlay';
        overlay.innerHTML = `
            <div class="popup-card">
                <div class="avatar-glow">
                    <img src="https://i.postimg.cc/fLbNQTqC/Youssef.jpg" alt="Youssef Salim" loading="eager">
                </div>
                <h2>𝒀𝒐𝒖𝒔𝒔𝒆𝒇 𝒔𝒂𝒍𝒊𝒎</h2>
                <div class="popup-phone">📞 01271161168</div>
                <div class="popup-desc">✨ Welcome To ✨<br> Qureo Answers</div>
                <div class="close-hint">( اضغط في أي مكان للإغلاق )</div>
            </div>
        `;
        document.body.appendChild(overlay);
        
        let isClosing = false;
        let autoTimeout = setTimeout(() => closePopup(overlay, () => isClosing = true), 5000);
        
        const closePopup = (overlayEl, setFlag) => {
            if (isClosing) return;
            setFlag();
            clearTimeout(autoTimeout);
            overlayEl.classList.add('fade-out');
            overlayEl.addEventListener('transitionend', () => overlayEl.remove(), { once: true });
        };
        
        const handleOutsideClick = (e) => {
            if (e.target === overlay) {
                closePopup(overlay, () => isClosing = true);
            }
        };
        overlay.addEventListener('click', handleOutsideClick);
        // لتجنب تسريب الذاكرة
        overlay.addEventListener('transitionend', () => overlay.removeEventListener('click', handleOutsideClick));
    }
    
    window.addEventListener('load', () => setTimeout(createWelcomePopup, 200));
</script>
